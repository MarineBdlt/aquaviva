{% extends "layout.html" %}

{% block title %}
Gallery
{% endblock %}

{% block main %}
<div class="container">
    <h1 class="text-warning mb-4">{{ gallery_content.title }}</h1>
    <p class="lead text-dark">{{ gallery_content.body }}</p>

    <div class="row g-3 mt-2">
        {% for image in gallery_images %}
        <div class="col-md-4">
            <div class="card shadow-sm">
                <img src="/static/{{ image.image_file }}" class="card-img-top" alt="{{ image.caption or 'gallery image' }}">
                {% if image.caption %}
                <div class="card-body">
                    <p class="card-text">{{ image.caption }}</p>
                </div>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
